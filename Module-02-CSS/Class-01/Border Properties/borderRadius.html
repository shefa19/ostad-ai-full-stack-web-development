<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Border Radius</title>

    <style>
      .box1 {
        border: 2px solid blue;
        border-radius: 10px;
        padding: 20px;
      }

      .box2 {
        border: 2px solid green;
        border-radius: 50%;
        width: 100px;
        height: 100px;
      }
    </style>
  </head>
  <body>
    <div class="box1">Rounded Box</div>
    <br />
    <div class="box2"></div>
  </body>
</html>
