<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Negative Margin</title>
    <style>
      .box1 {
        background-color: skyblue;
        padding: 30px;
      }

      .box2 {
        background-color: lightcoral;
        padding: 30px;
        margin-top: -20px;
      }
    </style>
  </head>
  <body>
    <div class="box1">First Box</div>
    <div class="box2">Second Box</div>
  </body>
</html>
