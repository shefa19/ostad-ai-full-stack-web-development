<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loop</title>
  </head>
  <body>
    <script>
      // For Loop

      let n = 10;

      for (let i = 0; i <= n; i++) {
        console.log("Hello Bangladesh");
      }

      for (let i = 1; i <= n; i++) {
        console.log(`5 x ${i} = ${i * 5}`);
      }

      // break & continue
      for (i = 0; i <= n; i++) {
        if (i == 3) {
          continue;
        } else if (i == 8) {
          break;
        }

        console.log(i);
      }

      // While Loop
    </script>
  </body>
</html>
