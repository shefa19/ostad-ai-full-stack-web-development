<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conditional Statement</title>
  </head>
  <body>
    <script>
      let age = 15;

      if (age >= 18) {
        console.log("You are and adult.");
      } else {
        console.log("You are a minor.");
      }

      let mark = 70;

      if (mark >= 80) {
        console.log("A+");
      } else if (mark >= 70) {
        console.log("A");
      } else if (mark >= 33) {
        console.log("D");
      } else {
        console.log("Fail");
      }
    </script>
  </body>
</html>
