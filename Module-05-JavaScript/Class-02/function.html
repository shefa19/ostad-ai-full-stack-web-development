<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Function</title>
  </head>
  <body>
    <script>
      //   Function
      function sayHello() {
        console.log("Hello World!");
      }

      sayHello();

      // Function Parameter
      function add(num1, num2) {
        console.log(`Summation of ${num1} and ${num2} is: ${num1 + num2}`);
      }

      add(10, 20);

      // Function Return
      function sub(num1, num2) {
        return num1 - num2;
      }

      let result = sub(10, 5);
      console.log(result);
    </script>
  </body>
</html>
