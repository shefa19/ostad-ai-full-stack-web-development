<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array Method</title>
  </head>
  <body>
    <h1>Array Method</h1>
    <ul style="list-style: square">
      <li>at()</li>
      <li>concat()</li>
      <li>every()</li>
      <li>filter()</li>
      <li>findIndex()</li>
      <li>from()</li>
      <li>includes()</li>
      <li>join()</li>
      <li>lastIndexOf()</li>
      <li>length()</li>
      <li>pop()</li>
    </ul>

    <script>
      // Array at() Method

      const numbers = [10, 21, 30, 40, 53];
      console.log(numbers.at(2));

      //   Array concat() method

      const fruits = ["Apple", "Banana"];
      const vegetable = ["Carrot", "Tomato"];

      const result = fruits.concat(vegetable);
      console.log(result);

      //   Array every() method

      const x = numbers.every((num) => num > 5);
      console.log(x);

      //   Array filter() method

      const y = numbers.filter((num) => num % 2 == 0);
      console.log(y);

      //   Array find() method

      const z = numbers.find((num) => num > 30);
      console.log(z);

      //   Array findIndex() method

      const w = numbers.findIndex((num) => num > 10);
      console.log(w);

      //   Array from() method
      const str = "HELLO";

      const a = Array.from(str);
      console.log(a[1]);

      // Array includes() method
      const b = fruits.includes("Banana");
      console.log(b);

      //   Array join() method
      const word = ["I", "Love", "Bangladesh"];
      const msg = word.join(" ");
      console.log(msg);

      //   Array lastIndexOf() method
      const num = [1, 2, 3, 4, 2, 5];

      const c = num.lastIndexOf(2);
      console.log(c);

      //   Array length() method
      const animals = ["Cat", "Dog", "Rabbit", "Mouse", "Bird"];
      console.log(animals.length);

      //   Array pop() & push() & shift() method
      animals.pop();
      console.log(animals);

      animals.push("Monkey");
      console.log(animals);

      animals.shift();
      console.log(animals);

      //   Array reverse() method
      animals.reverse();
      console.log(animals);

      //   Array slice() method
      let names = ["Shefa", "Rifa", "Rafsan", "Muntaha"];
      let someNames = names.slice(1, 3);

      console.log(someNames);

      //   Array splice() method
      names.splice(3, 3, "Muskan");
      console.log(names);

      //   Array unshift() method
      names.unshift("Mehzabin");
      console.log(names);

      //   Array sort() method
      names.sort();
      console.log(names);

      let roll = [10, 29, 48, 31, 24];
      roll.sort((a, b) => a - b); // ascending order
      console.log(roll);

      //   Array some() method
      let hasLargeNumber = numbers.some((num) => num > 10);
      console.log(hasLargeNumber);

      //   Array toString() method
      let letters = ["a", "b", "c"];
      let o = letters.toString();

      console.log(o);
      console.log(letters);
    </script>
  </body>
</html>
