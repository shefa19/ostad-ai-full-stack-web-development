<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>
  </head>
  <body>
    <form action="">
      <caption>
        <strong>Student Registration Form</strong>
      </caption>
      <br /><br />

      <label for="name">Full Name : *</label><br />
      <input
        type="text"
        name="Full Name"
        id="name"
        placeholder="Enter your full name"
        required
      />
      <br /><br />

      <label for="mail">Email :</label><br />
      <input
        type="email"
        name="Email"
        id="mail"
        placeholder="Ex. abc@gmail.com"
      />
      <br /><br />

      <label for="phn">Phone Number : *</label><br />
      <input
        type="tel"
        name="Phone Number"
        id="phn"
        placeholder="Ex. 01700000000"
        required
      />
      <br /><br />

      <label for="db">Date of Birth :</label>
      <input type="date" name="Birth Date" id="db" />
      <br /><br />

      <label>Gender :</label>
      <label for="Male">
        <input type="radio" name="Gender" id="gender" value="Male" checked />
        Male
      </label>
      <label for="Female">
        <input type="radio" name="Gender" id="gender" value="Female" />
        Female
      </label>
      <label for="Other">
        <input type="radio" name="Gender" id="gender" value="Other" />
        Other
      </label>
      <br /><br />

      <label for="dept">Department :</label>
      <select name="Department" id="dept">
        <option value="CSE">CSE</option>
        <option value="EEE">EEE</option>
        <option value="BBA">BBA</option>
        <option value="English">English</option>
      </select>
      <br /><br />

      <label for="">Skill :</label><br />
      <label for="html">
        <input type="checkbox" name="HTML" id="html" />HTML</label
      >
      <label for="css"> <input type="checkbox" name="CSS" id="css" />CSS</label>
      <br />
      <label for="js">
        <input type="checkbox" name="JavaScript" id="js" />JavaScript</label
      >
      <label for="react"
        ><input type="checkbox" name="React" id="react" />React</label
      >
      <br /><br />

      <label for="address">Address : *</label><br />
      <textarea
        name="Address"
        id="address"
        rows="1"
        placeholder="Enter your present address"
        required
      ></textarea>
      <br /><br />

      <label for="photo">Upload Profile Picture : *</label><br />
      <input type="file" name="Profile Picture" id="photo" required />
      <br /><br />

      <label for="password">Password : *</label><br />
      <input
        type="password"
        name="Password"
        id="password"
        placeholder="Enter a strong password"
        required
      />
      <br /><br />

      <label for="confirmPassword">Confirm Password : *</label><br />
      <input
        type="password"
        name="Confirm Password"
        id="confirmPassword"
        placeholder="Re-enter your password"
        required
      />
      <br /><br />

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
