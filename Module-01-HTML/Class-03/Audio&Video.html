<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio & Video Elements</title>
  </head>
  <body>
    <h1>Audio & Video Elements</h1>

    <h2>Audio Element</h2>
    <audio controls>
      <source src="sample-12s.mp3" type="audio/mpeg3" />
      Your browser does not support the audio file.
    </audio>

    <h2>Video Element</h2>
    <video
      width="320"
      height="240"
      autoplay
      muted
      poster="sample-5s-720p.jpg"
      loop
      controls
    >
      <source src="./MD Shafaul Islam.jpg" type="video/mp4" />
      Your browser does not support the video file.
    </video>
  </body>
</html>
